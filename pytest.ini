[pytest]

testpaths =
    tests
    api_tests
    ui_tests/tests
    accessibility
    mobile_tests/tests

python_files =
    test_*.py

python_classes =
    Test*

python_functions =
    test_*

addopts =
    -v
    --strict-markers

markers =
    smoke: Critical smoke tests
    regression: Full regression tests
    ui: Web UI tests
    api: API tests
    mobile: Mobile tests
    performance: Performance tests
    security: Security tests
    accessibility: Accessibility tests
    ai: AI-powered tests