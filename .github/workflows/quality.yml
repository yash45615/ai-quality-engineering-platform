name: Quality Engineering Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  quality-tests:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Chromium
        run: |
          playwright install --with-deps chromium

      - name: Run API tests
        run: |
          pytest api_tests -v

      - name: Run UI tests
        run: |
          pytest ui_tests/tests -v

      - name: Run accessibility tests
        run: |
          pytest accessibility -v

      - name: Run health tests
        run: |
          pytest tests -v

      - name: Generate Allure results
        if: always()
        run: |
          pytest \
            api_tests \
            ui_tests/tests \
            accessibility \
            --alluredir=allure-results || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: allure-results